<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>月次計画 逆算ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#fff;}
:root{
  --y:#FFD600;--yd:#F5C400;--yl:#FFF9C4;--yll:#FFFDE7;
  --tx:#1a1a1a;--mu:#888;
  --bdr:#F0F0F0;--bdr2:#E8E8E8;
  --ok:#16a34a;--wa:#d97706;--ng:#dc2626;
  --pr:#2563EB;--net:#0891b2;--sw:#7c3aed;
  --mis:#26C6DA;--misd:#00ACC1;--misll:#E0F7FA;
  --ff:'Nunito',sans-serif;--fm:'JetBrains Mono',monospace;
  --sh:0 2px 12px rgba(0,0,0,.07);
  --sh2:0 4px 24px rgba(255,214,0,.35);
}
.app{min-height:100vh;background:#fff;font-family:var(--ff);color:var(--tx);padding:32px 16px 80px;}
.wrap{max-width:900px;margin:0 auto;}

/* header */
.hd{background:var(--y);border-radius:20px;padding:28px 28px 24px;margin-bottom:24px;position:relative;overflow:hidden;}
.hd::before{content:'';position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.18);}
.hd::after{content:'';position:absolute;right:40px;bottom:-30px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.12);}
.hd h1{font-size:clamp(22px,4vw,32px);font-weight:900;color:#1a1a1a;letter-spacing:-.02em;line-height:1.1;position:relative;}
.hd h1 mark{background:#1a1a1a;color:var(--y);border-radius:6px;padding:1px 7px;font-style:normal;}
.hd p{margin-top:8px;font-size:12px;color:rgba(26,26,26,.6);font-weight:700;position:relative;}
.month-tag{background:#1a1a1a;color:var(--y);font-family:var(--fm);font-size:11px;border-radius:8px;padding:5px 12px;white-space:nowrap;position:relative;display:inline-block;margin-top:12px;font-weight:700;}

/* tabs */
.tabs{display:flex;gap:4px;margin-bottom:22px;background:#F5F5F5;border-radius:14px;padding:4px;width:fit-content;flex-wrap:wrap;}
.tab{padding:9px 20px;border-radius:11px;font-size:13px;font-weight:800;cursor:pointer;border:none;background:transparent;color:var(--mu);font-family:var(--ff);transition:all .18s;}
.tab.on{background:var(--y);color:#1a1a1a;box-shadow:0 2px 8px rgba(255,214,0,.4);}

/* card */
.card{background:#fff;border:2px solid var(--bdr);border-radius:18px;padding:22px;margin-bottom:14px;box-shadow:var(--sh);}
.card-ttl{font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin-bottom:18px;display:flex;align-items:center;gap:8px;}
.card-ttl::after{content:'';flex:1;height:2px;background:var(--bdr);border-radius:2px;}

/* pills */
.pill{font-size:11px;font-weight:900;letter-spacing:.04em;padding:3px 10px;border-radius:20px;}
.pill-pr{background:#DBEAFE;color:var(--pr);}
.pill-net{background:#CFFAFE;color:var(--net);}
.pill-sw{background:#EDE9FE;color:var(--sw);}
.pill-rev{background:#DCFCE7;color:var(--ok);}

/* field grids */
.fg{display:grid;gap:12px;}
.fg2{grid-template-columns:1fr 1fr;}
.fg3{grid-template-columns:1fr 1fr 1fr;}
@media(max-width:600px){.fg3{grid-template-columns:1fr 1fr;}}
@media(max-width:380px){.fg2,.fg3{grid-template-columns:1fr;}}

.f label{display:block;font-size:11px;font-weight:800;color:var(--mu);margin-bottom:5px;letter-spacing:.05em;text-transform:uppercase;}
.f input{width:100%;border:2px solid var(--bdr2);border-radius:10px;padding:10px 12px;font-family:var(--fm);font-size:15px;font-weight:700;color:var(--tx);background:#FAFAFA;outline:none;transition:border-color .15s,background .15s,box-shadow .15s;-moz-appearance:textfield;}
.f input::-webkit-outer-spin-button,.f input::-webkit-inner-spin-button{-webkit-appearance:none;}
.f input:focus{border-color:var(--y);background:#fff;box-shadow:0 0 0 3px rgba(255,214,0,.25);}
.f input::placeholder{color:#ccc;}
.f input:disabled{color:#1a1a1a;font-weight:800;background:var(--yl);border-color:var(--yd);cursor:default;}

/* arpu box */
.arpu-box{background:var(--y);border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.arpu-label{font-size:11px;color:rgba(26,26,26,.65);font-weight:800;letter-spacing:.04em;}
.arpu-val{font-family:var(--fm);font-size:16px;font-weight:700;color:#1a1a1a;}

/* yomi */
.yomi-row{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px;}
@media(max-width:560px){.yomi-row{grid-template-columns:repeat(3,1fr);}}
.yb{border:2px solid var(--bdr2);border-radius:12px;padding:10px 6px;text-align:center;background:#FAFAFA;transition:border-color .15s,background .15s;}
.yb:focus-within{border-color:var(--y);background:#fff;box-shadow:0 0 0 3px rgba(255,214,0,.2);}
.yb-name{font-size:11px;font-weight:900;margin-bottom:2px;}
.yb-pct{font-size:9px;color:var(--mu);margin-bottom:7px;font-family:var(--fm);font-weight:700;}
.yb input{width:100%;text-align:center;border:2px solid var(--bdr2);border-radius:7px;padding:6px 2px;font-family:var(--fm);font-size:16px;font-weight:700;background:#fff;color:var(--tx);outline:none;-moz-appearance:textfield;}
.yb input::-webkit-outer-spin-button,.yb input::-webkit-inner-spin-button{-webkit-appearance:none;}
.yb input:focus{border-color:var(--y);box-shadow:0 0 0 2px rgba(255,214,0,.3);}
.yn-zumi .yb-name{color:var(--ok);} .yn-zumi{border-color:#BBF7D0;background:#F0FDF4;}
.yn-a .yb-name{color:var(--pr);}
.yn-b .yb-name{color:#3B82F6;}
.yn-c .yb-name{color:var(--wa);}
.yn-d .yb-name{color:var(--ng);}
.yn-mis .yb-name{color:var(--mu);}

/* breakdown */
.bk{background:var(--yll);border:2px solid var(--yl);border-radius:12px;padding:14px 16px;font-size:12px;line-height:2;color:var(--mu);font-family:var(--fm);}
.bk-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:2px;}
.bk-hdiv{border:none;border-top:2px dashed var(--yd);margin:6px 0;}
.bk-total{color:var(--tx);font-weight:700;font-size:13px;}
.bk-diff-ok{color:var(--ok);font-weight:700;}
.bk-diff-ng{color:var(--ng);font-weight:700;}

/* type tabs */
.type-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.tt{padding:7px 18px;border-radius:20px;font-size:12px;font-weight:800;cursor:pointer;border:2px solid var(--bdr2);background:#fff;color:var(--mu);font-family:var(--ff);transition:all .15s;}
.tt-pr{background:var(--pr);border-color:var(--pr);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.3);}
.tt-net{background:var(--net);border-color:var(--net);color:#fff;box-shadow:0 2px 8px rgba(8,145,178,.3);}
.tt-sw{background:var(--sw);border-color:var(--sw);color:#fff;box-shadow:0 2px 8px rgba(124,58,237,.3);}

/* 商談化率 row */
.neg-rate-row{display:flex;align-items:center;gap:12px;background:#F5F5F5;border-radius:12px;padding:12px 14px;margin-bottom:14px;border:2px solid var(--bdr2);}
.neg-rate-row label{flex:1;font-size:12px;font-weight:900;color:var(--tx);}
.neg-rate-row .f{width:130px;flex-shrink:0;}
.neg-rate-row .f label{display:none;}

/* calc block */
.calc-blk{border:2px solid var(--yl);border-radius:16px;overflow:hidden;margin-bottom:14px;}
.calc-blk-hd{background:var(--y);padding:10px 16px;font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:rgba(26,26,26,.6);}
.calc-blk-body{background:var(--yll);padding:14px 16px;font-size:12px;font-family:var(--fm);color:var(--mu);}
.cb-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;flex-wrap:wrap;gap:4px;}
.cb-label{font-weight:700;}
.cb-val{font-weight:700;color:var(--tx);}
.cb-spotlight{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:10px;}
.cb-spotlight span{font-size:12px;font-weight:900;color:var(--tx);}
.cb-spotlight strong{font-size:20px;font-weight:700;color:var(--pr);}
.cb-shortage-ok{color:var(--ok);font-weight:700;}
.cb-shortage-ng{color:var(--ng);font-weight:700;}
.cb-meet-needed{color:var(--pr);font-weight:700;}
.cb-monthly{background:#1a1a1a;border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
.cb-monthly-lbl{font-size:10px;font-weight:900;color:rgba(255,255,255,.5);letter-spacing:.06em;text-transform:uppercase;}
.cb-monthly-sub{font-size:10px;color:rgba(255,255,255,.4);margin-top:2px;}
.cb-monthly-val{font-size:24px;font-weight:700;color:var(--y);}

/* hero result card */
.hero-card{background:var(--y);border-radius:20px;padding:28px 24px;margin-bottom:14px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--sh2);position:relative;overflow:hidden;}
.hero-card::before{content:'';position:absolute;right:-20px;top:-20px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.2);}
.hero-label{font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:rgba(26,26,26,.55);position:relative;}
.hero-val{font-family:var(--fm);font-size:56px;font-weight:700;color:#1a1a1a;line-height:1;position:relative;}
.hero-unit{font-size:20px;font-weight:400;margin-left:4px;}
.hero-sub{font-size:12px;color:rgba(26,26,26,.55);margin-top:4px;font-family:var(--fm);font-weight:700;position:relative;}

/* result cards */
.rc3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px;}
@media(max-width:560px){.rc3{grid-template-columns:1fr 1fr;}}
.rc{background:#fff;border:2px solid var(--bdr);border-radius:14px;padding:16px 14px;box-shadow:var(--sh);}
.rc .rl{font-size:10px;font-weight:900;color:var(--mu);margin-bottom:6px;letter-spacing:.06em;text-transform:uppercase;}
.rc .rv{font-family:var(--fm);font-size:26px;font-weight:700;line-height:1;}
.rc .ru{font-size:13px;font-weight:400;margin-left:2px;}
.rc .rs{font-size:10px;color:var(--mu);margin-top:5px;line-height:1.6;font-weight:700;}

/* progress */
.pb-wrap{margin-bottom:12px;}
.pb-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;font-weight:800;}
.pb-label span:last-child{font-family:var(--fm);color:var(--mu);font-weight:700;}
.pb-track{height:8px;border-radius:8px;background:#F0F0F0;overflow:hidden;}
.pb-fill{height:100%;border-radius:8px;transition:width .5s cubic-bezier(.4,0,.2,1);}
.pf-pr{background:linear-gradient(90deg,var(--pr),#60A5FA);}
.pf-net{background:linear-gradient(90deg,var(--net),#22D3EE);}
.pf-sw{background:linear-gradient(90deg,var(--sw),#A78BFA);}

/* week plan */
.wk-plan{background:#fff;border:2px solid var(--bdr);border-radius:16px;overflow:hidden;box-shadow:var(--sh);}
.wk-head{display:grid;background:var(--y);border-bottom:2px solid var(--yd);}
.wk-row{display:grid;border-bottom:1px solid var(--bdr);}
.wk-row:last-child{border-bottom:none;}
.wk-head span,.wk-row span{padding:11px 12px;font-size:11px;}
.wk-head span{font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#1a1a1a;}
.wk-row .wk-n{font-family:var(--fm);color:var(--mu);font-size:11px;font-weight:700;}
.wk-row .wk-v{font-family:var(--fm);font-weight:700;font-size:13px;color:#444;}
.wk-row .wk-total{font-family:var(--fm);font-weight:700;font-size:14px;color:#1a1a1a;}

/* alerts */
.al{border-radius:12px;padding:13px 16px;font-size:12px;line-height:1.7;margin-bottom:14px;font-weight:800;}
.al-ok{background:#F0FDF4;border:2px solid #86EFAC;color:var(--ok);}
.al-wa{background:#FFFBEB;border:2px solid #FDE68A;color:var(--wa);}
.al-ng{background:#FEF2F2;border:2px solid #FECACA;color:var(--ng);}

/* slider */
.sl-row{display:flex;align-items:center;gap:12px;}
.sl-row input[type=range]{flex:1;-webkit-appearance:none;height:6px;border-radius:6px;outline:none;border:none;background:linear-gradient(to right,var(--y) 0%,var(--y) var(--fill,0%),#F0F0F0 var(--fill,0%),#F0F0F0 100%);}
.sl-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--y);cursor:pointer;border:3px solid #fff;box-shadow:0 0 0 2px var(--yd),0 2px 8px rgba(255,214,0,.4);}
.sl-val{font-family:var(--fm);font-size:22px;font-weight:700;min-width:32px;text-align:center;color:#1a1a1a;}

/* nav btn */
.nav-btn{display:inline-block;padding:12px 32px;border-radius:12px;font-size:14px;font-weight:900;cursor:pointer;border:none;background:var(--y);color:#1a1a1a;font-family:var(--ff);margin-top:4px;box-shadow:0 4px 14px rgba(255,214,0,.4);transition:transform .15s,box-shadow .15s;}
.nav-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(255,214,0,.5);}
.empty{text-align:center;padding:48px 20px;color:var(--mu);font-size:14px;font-weight:700;}

/* strategy selector */
.strat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:500px){.strat-grid{grid-template-columns:1fr;}}
.strat-card{border:2px solid var(--bdr2);border-radius:14px;padding:16px;cursor:pointer;transition:all .18s;background:#FAFAFA;text-align:left;font-family:var(--ff);width:100%;}
.strat-card:hover{border-color:var(--yd);background:var(--yll);}
.strat-card.selected{border-color:var(--y);background:var(--yl);box-shadow:0 0 0 3px rgba(255,214,0,.3);}
.strat-card .st-icon{font-size:22px;margin-bottom:8px;}
.strat-card .st-name{font-size:13px;font-weight:900;color:#1a1a1a;margin-bottom:4px;}
.strat-card .st-desc{font-size:11px;color:var(--mu);font-weight:700;line-height:1.5;}

/* seg row */
.seg-grid{display:grid;gap:8px;margin-bottom:14px;}
.seg-row{background:#fff;border:2px solid var(--bdr);border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:14px;box-shadow:var(--sh);}
.seg-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.seg-icon-white{background:#F0F0F0;}
.seg-icon-net{background:#CFFAFE;}
.seg-icon-sw{background:#EDE9FE;}
.seg-body{flex:1;}
.seg-name{font-size:12px;font-weight:900;color:#1a1a1a;margin-bottom:2px;}
.seg-target{font-size:11px;color:var(--mu);font-weight:700;}
.seg-num{text-align:right;flex-shrink:0;}
.seg-cnt{font-family:var(--fm);font-size:24px;font-weight:700;color:#1a1a1a;line-height:1;}
.seg-unit{font-size:11px;color:var(--mu);font-weight:700;}
.seg-week{font-family:var(--fm);font-size:11px;color:var(--mu);margin-top:2px;}
/* ── Login ── */
.login-overlay{position:fixed;inset:0;background:#fff;z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;}
.login-box{width:100%;max-width:400px;}
.login-logo{font-size:clamp(22px,4vw,30px);font-weight:900;color:#1a1a1a;margin-bottom:8px;}
.login-logo mark{background:var(--y);color:#1a1a1a;border-radius:6px;padding:1px 7px;font-style:normal;}
.login-sub{font-size:13px;color:var(--mu);font-weight:700;margin-bottom:28px;line-height:1.6;}
.login-input{width:100%;border:2.5px solid var(--bdr2);border-radius:14px;padding:15px 16px;font-family:var(--fm);font-size:20px;font-weight:700;color:var(--tx);background:#FAFAFA;outline:none;transition:border-color .15s,box-shadow .15s;margin-bottom:12px;display:block;}
.login-input:focus{border-color:var(--y);box-shadow:0 0 0 3px rgba(255,214,0,.25);}
.login-btn{width:100%;padding:16px;border-radius:14px;font-size:15px;font-weight:900;cursor:pointer;border:none;background:var(--y);color:#1a1a1a;font-family:var(--ff);box-shadow:0 4px 18px rgba(255,214,0,.45);transition:transform .15s;margin-bottom:28px;display:block;}
.login-btn:hover{transform:translateY(-2px);}
.login-members-lbl{font-size:11px;font-weight:900;color:var(--mu);text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px;}
.user-chips{display:flex;flex-wrap:wrap;gap:8px;}
.user-chip{padding:9px 18px;border-radius:20px;font-size:13px;font-weight:800;cursor:pointer;border:2px solid var(--bdr2);background:#FAFAFA;color:var(--tx);font-family:var(--ff);transition:all .15s;}
.user-chip:hover{border-color:var(--yd);background:var(--yl);}
/* ── User Badge ── */
.ubw{position:absolute;top:18px;right:20px;z-index:10;}
.ub{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.9);border-radius:20px;padding:6px 12px 6px 8px;cursor:pointer;border:2px solid rgba(0,0,0,.1);transition:background .15s;user-select:none;}
.ub:hover{background:#fff;}
.ub-av{width:26px;height:26px;border-radius:50%;background:#1a1a1a;color:var(--y);font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ub-nm{font-size:13px;font-weight:900;color:#1a1a1a;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ub-cr{font-size:9px;color:var(--mu);}
/* ── User Dropdown ── */
.udrop{position:absolute;top:calc(100% + 8px);right:0;background:#fff;border-radius:16px;border:2px solid var(--bdr2);box-shadow:0 8px 32px rgba(0,0,0,.12);min-width:190px;padding:8px;z-index:200;display:none;}
.udrop.open{display:block;}
.udrop-sec{font-size:10px;font-weight:900;color:var(--mu);letter-spacing:.1em;text-transform:uppercase;padding:6px 10px 4px;}
.ud-item{padding:10px 12px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:800;color:var(--tx);transition:background .1s;display:flex;align-items:center;gap:8px;}
.ud-item:hover{background:#F5F5F5;}
.ud-item.cur{background:var(--yl);}
.ud-av{width:22px;height:22px;border-radius:50%;background:#1a1a1a;color:var(--y);font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ud-div{height:1px;background:var(--bdr);margin:6px 4px;}
.ud-lo{color:var(--ng) !important;}
</style>
</head>
<body>
<!-- LOGIN OVERLAY -->
<div id="loginOverlay" class="login-overlay">
  <div class="login-box">
    <div class="login-logo">月次計画<mark>逆算</mark>ツール</div>
    <div class="login-sub">名前を入力してログイン<br>同じ名前で再ログインすると前回データが復元されます</div>
    <input id="loginNameInput" class="login-input" type="text" placeholder="例: 田中" maxlength="20"
      onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">ログイン / 登録</button>
    <div id="existingUsersSection" style="display:none">
      <div class="login-members-lbl">登録済みメンバー（タップでログイン）</div>
      <div id="userChips" class="user-chips"></div>
    </div>
  </div>
</div>
<div class="app">
<div class="wrap">

<!-- HEADER -->
<div class="hd" style="position:relative">
  <h1>月次計画<mark>逆算</mark>ツール</h1>
  <p>目標 − ヨミ着地 ＝ 差分 → 必要行動数を自動算出</p>
  <div class="month-tag" id="monthTag">—</div>
  <!-- User Badge -->
  <div class="ubw" id="userBadgeWrap" style="display:none">
    <div class="ub" onclick="toggleUserMenu()">
      <div class="ub-av" id="userBadgeAv">?</div>
      <span class="ub-nm" id="userBadgeNm">—</span>
      <span class="ub-cr">▾</span>
    </div>
    <div class="udrop" id="userDrop">
      <div class="udrop-sec">メンバー切替</div>
      <div id="userDropItems"></div>
      <div class="ud-div"></div>
      <div class="ud-item ud-lo" onclick="logout()">ログアウト</div>
    </div>
  </div>
</div>

<!-- TABS -->
<div class="tabs">
  <button class="tab on" onclick="switchTab('goal')">① 目標設定</button>
  <button class="tab"    onclick="switchTab('yomi')">② ヨミ入力</button>
  <button class="tab"    onclick="switchTab('result')">③ 行動計画</button>
</div>

<!-- ══ TAB 1: 目標設定 ══ -->
<div id="tab-goal">

  <!-- PR -->
  <div class="card">
    <div class="card-ttl"><span class="pill pill-pr">PR</span>新規PR 目標</div>
    <div class="fg fg2" style="margin-bottom:12px">
      <div class="f"><label>PR件数目標</label><input id="inp-pr-cnt" type="number" placeholder="例: 5" onchange="sg('pr_cnt',this.value)"></div>
      <div class="f"><label>新規売上目標（円）</label><input id="inp-pr-rev" type="number" placeholder="例: 125000" onchange="sg('pr_rev',this.value);updArpu()"></div>
    </div>
    <div class="arpu-box" style="margin-bottom:12px">
      <span class="arpu-label">予算ARPU（新規売上 ÷ 件数）</span>
      <span class="arpu-val" id="prArpuBudget">—</span>
    </div>
    <div class="fg fg2">
      <div class="f"><label>平均受注率（%）</label><input id="inp-pr-rate" type="number" placeholder="例: 15" onchange="sg('pr_rate',this.value)"></div>
      <div class="f"><label>想定ARPU（円）</label><input id="inp-pr-arpu" type="number" placeholder="例: 17500" onchange="sg('pr_arpu_est',this.value);updArpu()"></div>
    </div>
  </div>

  <!-- NET -->
  <div class="card">
    <div class="card-ttl"><span class="pill pill-net">NET</span>ネット予約 目標</div>
    <div class="fg fg2">
      <div class="f"><label>ネット件数目標</label><input id="inp-net-cnt" type="number" placeholder="例: 3" onchange="sg('net_cnt',this.value)"></div>
      <div class="f"><label>平均受注率（%）</label><input id="inp-net-rate" type="number" placeholder="例: 50" onchange="sg('net_rate',this.value)"></div>
    </div>
  </div>

  <!-- 売上サマリー -->
  <div class="card">
    <div class="card-ttl"><span class="pill pill-rev">売上</span>月間売上 サマリー</div>
    <div style="background:#F9F9F9;border-radius:12px;padding:14px;">
      <div style="font-size:10px;font-weight:900;color:var(--mu);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em;">合計売上目標</div>
      <div style="font-family:var(--fm);font-size:18px;font-weight:700;" id="totalRevGoal">—</div>
    </div>
  </div>

  <!-- 切替 -->
  <div class="card">
    <div class="card-ttl"><span class="pill pill-sw">切替</span>切替アップセル 目標</div>
    <div class="fg fg2" style="margin-bottom:12px">
      <div class="f"><label>切替件数目標</label><input id="inp-sw-cnt" type="number" placeholder="例: 3" onchange="sg('sw_cnt',this.value)"></div>
      <div class="f"><label>切替売上目標（円）</label><input id="inp-sw-rev" type="number" placeholder="例: 45000" onchange="sg('sw_rev',this.value);updArpu()"></div>
    </div>
    <div class="arpu-box" style="margin-bottom:12px">
      <span class="arpu-label">予算ARPU（切替売上 ÷ 件数）</span>
      <span class="arpu-val" id="swArpuBudget">—</span>
    </div>
    <div class="fg fg2">
      <div class="f"><label>平均受注率（%）</label><input id="inp-sw-rate" type="number" placeholder="例: 40" onchange="sg('sw_rate',this.value)"></div>
      <div class="f"><label>想定ARPU（円）</label><input id="inp-sw-arpu" type="number" placeholder="例: 12000" onchange="sg('sw_arpu_est',this.value);updArpu()"></div>
    </div>
  </div>

  <!-- 残り週数 -->
  <div class="card">
    <div class="card-ttl">残り週数</div>
    <div class="sl-row">
      <input type="range" min="1" max="4" value="3" style="--fill:66.6%" oninput="setWeeks(this.value);this.style.setProperty('--fill',((this.value-1)/3*100)+'%')">
      <span class="sl-val" id="slVal">3</span>
      <span style="font-size:12px;font-weight:800;color:var(--mu)">週</span>
    </div>
  </div>

  <button class="nav-btn" onclick="switchTab('yomi')">次へ：ヨミを入力 →</button>
</div><!-- /tab-goal -->

<!-- ══ TAB 2: ヨミ入力 ══ -->
<div id="tab-yomi" style="display:none">

  <!-- Type tabs -->
  <div class="type-tabs" id="typeTabs">
    <button class="tt tt-pr" onclick="setActiveType('pr')">PR</button>
    <button class="tt"       onclick="setActiveType('net')">NET</button>
    <button class="tt"       onclick="setActiveType('sw')">切替</button>
  </div>

  <!-- Yomi card (re-rendered) -->
  <div id="yomiCard"></div>

  <!-- 計算ブロック（合計・全種別） -->
  <div id="calcBlock"></div>

  <button class="nav-btn" onclick="switchTab('result')">行動計画を見る →</button>
</div><!-- /tab-yomi -->

<!-- ══ TAB 3: 行動計画 ══ -->
<div id="tab-result" style="display:none"></div>

</div><!-- /wrap -->
</div><!-- /app -->

<script>
// ── STATE ──
const ST = {
  tab: 'goal',
  activeType: 'pr',
  goal: { pr_cnt:'', pr_rev:'', pr_rate:'', pr_arpu_est:'', net_cnt:'', net_rate:'', sw_cnt:'', sw_rev:'', sw_rate:'', sw_arpu_est:'' },
  yomi: {
    pr:  { zumi:'', a:'', b:'', c:'', d:'', mis:'' },
    net: { zumi:'', a:'', b:'', c:'', d:'', mis:'' },
    sw:  { zumi:'', a:'', b:'', c:'', d:'', mis:'' },
  },
  inNegManual: { pr: null, net: null, sw: null },
  weeksLeft: 3,
  misTarget:  { pr: '', net: '', sw: '' },
  actionAdj:  { pr: '', net: '', sw: '' },
};

const YOMI_DEF = [
  { key:'zumi', label:'済',     pctLabel:'確定',  rate:1.0, cls:'yn-zumi' },
  { key:'a',    label:'Aヨミ',  pctLabel:'100%',  rate:1.0, cls:'yn-a'   },
  { key:'b',    label:'Bヨミ',  pctLabel:'70%',   rate:0.7, cls:'yn-b'   },
  { key:'c',    label:'Cヨミ',  pctLabel:'30%',   rate:0.3, cls:'yn-c'   },
  { key:'d',    label:'Dヨミ',  pctLabel:'10%',   rate:0.1, cls:'yn-d'   },
  { key:'mis',  label:'未商談', pctLabel:'要商談', rate:0,   cls:'yn-mis' },
];

// ── HELPERS ──
const $   = id => document.getElementById(id);
const nv  = v  => parseFloat(v) || 0;
const cl  = v  => Math.max(0, Math.ceil(v));
const f1  = v  => Math.round(v * 10) / 10;
const yen = v  => Math.round(v).toLocaleString('ja-JP') + '円';

// ── STATE SETTERS ──
function sg(k, v)   { ST.goal[k] = v; update(); }
function setWeeks(v){ ST.weeksLeft = +v || 1; $('slVal').textContent = v; update(); }
function setActiveType(t) {
  ST.activeType = t;
  document.querySelectorAll('.type-tabs .tt').forEach((btn, i) => {
    const types = ['pr','net','sw'];
    const clsMap = { pr:'tt-pr', net:'tt-net', sw:'tt-sw' };
    btn.className = 'tt' + (types[i] === t ? ' ' + clsMap[types[i]] : '');
  });
  renderYomiCard();
  renderCalcBlock();
}
function setYomi(type, key, val) {
  ST.yomi[type][key] = val;
  renderYomiCard();
  renderCalcBlock();
  if (ST.tab === 'result') renderResultTab();
  updArpu();
}
function setMisTarget(type, val) {
  ST.misTarget[type] = val;
  renderResultTab();
}
function setActionAdj(type, val) {
  ST.actionAdj[type] = val;
  renderResultTab();
}
function setInNegType(type, val) {
  ST.inNegManual[type] = val === '' ? null : +val;
  renderResultTab();
  if (ST.tab === 'yomi') { renderYomiCard(); renderCalcBlock(); }
}

// ── CALCULATIONS ──
function calcLanding(yomiType) {
  return YOMI_DEF.reduce((s, d) => s + nv(yomiType[d.key]) * d.rate, 0);
}

function calcType(typeKey, cntKey, rateKey) {
  const goalCnt = nv(ST.goal[cntKey]);
  const rate    = nv(ST.goal[rateKey]) / 100;
  const landing = calcLanding(ST.yomi[typeKey]);
  const diff    = Math.max(0, goalCnt - landing);
  const inNeg   = ['zumi','a','b','c','d'].reduce((s, k) => s + nv(ST.yomi[typeKey][k]), 0);
  const mis     = nv(ST.yomi[typeKey].mis);
  const newOpps = rate > 0 ? cl(diff / rate) : (diff > 0 ? 999 : 0);
  const weekly  = cl(newOpps / Math.max(1, ST.weeksLeft));
  const pct     = goalCnt > 0 ? Math.min(100, (landing / goalCnt) * 100) : 0;
  return { goalCnt, rate, landing, diff, inNeg, mis, newOpps, weekly, pct };
}

function calcAll() {
  const wk  = Math.max(1, ST.weeksLeft);
  const pr  = calcType('pr',  'pr_cnt',  'pr_rate');
  const net = calcType('net', 'net_cnt', 'net_rate');
  const sw  = calcType('sw',  'sw_cnt',  'sw_rate');

  const prArpuBudget = nv(ST.goal.pr_cnt) > 0 ? nv(ST.goal.pr_rev) / nv(ST.goal.pr_cnt) : 0;
  const swArpuBudget = nv(ST.goal.sw_cnt) > 0 ? nv(ST.goal.sw_rev) / nv(ST.goal.sw_cnt) : 0;
  const prArpu = nv(ST.goal.pr_arpu_est) || prArpuBudget;
  const swArpu = nv(ST.goal.sw_arpu_est) || swArpuBudget;
  const goalRev  = nv(ST.goal.pr_rev) + nv(ST.goal.sw_rev);
  const landRev  = pr.landing * prArpu + sw.landing * swArpu;
  const revPct   = goalRev > 0 ? Math.min(100, (landRev / goalRev) * 100) : 0;

  // 進行中から商談行く件数（タイプ別手打ち優先、なければヨミ自動計算）
  const prInNeg  = ST.inNegManual.pr  !== null ? ST.inNegManual.pr  : pr.inNeg;
  const netInNeg = ST.inNegManual.net !== null ? ST.inNegManual.net : net.inNeg;
  const swInNeg  = ST.inNegManual.sw  !== null ? ST.inNegManual.sw  : sw.inNeg;
  const inNeg    = prInNeg + netInNeg + swInNeg;
  const inNegCalc = pr.inNeg + net.inNeg + sw.inNeg;
  const totalMis  = pr.mis + net.mis + sw.mis;

  // 必要未商談 - 手打ちがあればそちらを使用（行動数の計算に反映）
  const prNewMeet  = ST.misTarget.pr  !== '' ? nv(ST.misTarget.pr)  : pr.newOpps;
  const netNewMeet = ST.misTarget.net !== '' ? nv(ST.misTarget.net) : net.newOpps;
  const swNewMeet  = ST.misTarget.sw  !== '' ? nv(ST.misTarget.sw)  : sw.newOpps;
  const newMeetings     = prNewMeet + netNewMeet + swNewMeet;
  const monthlyMeetings = inNeg + newMeetings;

  // 行動数（必要未商談数のみ。フォローは除く）
  const newActions   = newMeetings;
  const followActs   = totalMis;
  const adjTotal     = nv(ST.actionAdj.pr) + nv(ST.actionAdj.net) + nv(ST.actionAdj.sw);
  const totalActions = newActions + adjTotal;
  const weeklyActions = cl(totalActions / wk);

  // 未商談計画 × 受注率 = 期待着地追加分（タワー・プログレスバー用）
  const prExtLanding  = pr.landing  + nv(ST.misTarget.pr)  * pr.rate;
  const netExtLanding = net.landing + nv(ST.misTarget.net) * net.rate;
  const swExtLanding  = sw.landing  + nv(ST.misTarget.sw)  * sw.rate;
  const prExtPct  = pr.goalCnt  > 0 ? prExtLanding  / pr.goalCnt  * 100 : 0;
  const netExtPct = net.goalCnt > 0 ? netExtLanding / net.goalCnt * 100 : 0;
  const swExtPct  = sw.goalCnt  > 0 ? swExtLanding  / sw.goalCnt  * 100 : 0;

  return { pr, net, sw, wk, prArpu, swArpu, prArpuBudget, swArpuBudget,
           goalRev, landRev, revPct,
           prInNeg, netInNeg, swInNeg, inNeg, inNegCalc, totalMis, newMeetings, monthlyMeetings,
           newActions, followActs, adjTotal, totalActions, weeklyActions,
           prExtLanding, netExtLanding, swExtLanding, prExtPct, netExtPct, swExtPct };
}

// ── RENDER: ARPU & 売上 ──
function updArpu() {
  const c = calcAll();
  const prCnt = nv(ST.goal.pr_cnt), prRev = nv(ST.goal.pr_rev);
  const swCnt = nv(ST.goal.sw_cnt), swRev = nv(ST.goal.sw_rev);

  $('prArpuBudget').textContent = prCnt > 0 && prRev > 0 ? yen(prRev / prCnt) : '—';
  $('swArpuBudget').textContent = swCnt > 0 && swRev > 0 ? yen(swRev / swCnt) : '—';

  $('totalRevGoal').textContent = c.goalRev > 0 ? yen(c.goalRev) : '—';
}

// ── RENDER: YOMI CARD ──
function renderYomiCard() {
  const t = ST.activeType;
  const yd = ST.yomi[t];
  const PILL = { pr:'pill-pr', net:'pill-net', sw:'pill-sw' };
  const LABEL= { pr:'PR', net:'NET', sw:'切替' };
  const goalCnt = nv(ST.goal[t + '_cnt']);
  const tc = calcType(t, t + '_cnt', t + '_rate');

  const grid = YOMI_DEF.map(d => `
    <div class="yb ${d.cls}">
      <div class="yb-name">${d.label}</div>
      <div class="yb-pct">${d.pctLabel}</div>
      <input type="number" placeholder="0" value="${yd[d.key]}"
        onchange="setYomi('${t}','${d.key}',this.value)"
        onkeydown="if(event.key==='Enter')setYomi('${t}','${d.key}',this.value)" min="0">
    </div>`).join('');

  const rows = YOMI_DEF.filter(d => d.key !== 'mis' && nv(yd[d.key]) > 0).map(d => {
    const cnt = nv(yd[d.key]);
    return `<div class="bk-row"><span>${d.label}：${cnt}件 ${d.key !== 'zumi' ? '× '+d.pctLabel : '（確定）'}</span><span style="font-weight:700;color:var(--tx)">${f1(cnt * d.rate)}件</span></div>`;
  }).join('');

  const bk = rows ? `
    <div class="bk" style="margin-top:14px">
      <div style="font-weight:800;color:var(--tx);margin-bottom:4px">着地読み 計算</div>
      ${rows}
      <hr class="bk-hdiv">
      <div class="bk-row bk-total"><span>着地読み合計</span><span>${f1(tc.landing)}件</span></div>
      ${goalCnt > 0 ? `<div class="bk-row" style="margin-top:2px"><span style="color:var(--mu)">目標${goalCnt}件 − 着地${f1(tc.landing)}件</span><span class="${tc.diff > 0 ? 'bk-diff-ng' : 'bk-diff-ok'}">差分 ${f1(tc.diff)}件 ${tc.diff === 0 ? '✅' : ''}</span></div>` : ''}
    </div>` : '';

  $('yomiCard').innerHTML = `
    <div class="card">
      <div class="card-ttl"><span class="pill ${PILL[t]}">${LABEL[t]}</span>ヨミ別件数</div>
      <div class="yomi-row">${grid}</div>
      ${bk}
    </div>`;
}

// ── RENDER: CALC BLOCK (Tab 2) ──
function renderCalcBlock() {
  const c = calcAll();
  const { pr, net, sw, inNeg, inNegCalc, newMeetings, monthlyMeetings } = c;

  const typeDefs = [
    { label:'PR',  t:pr,  ratePct:nv(ST.goal.pr_rate),  pillCls:'pill-pr'  },
    { label:'NET', t:net, ratePct:nv(ST.goal.net_rate), pillCls:'pill-net' },
    { label:'切替', t:sw, ratePct:nv(ST.goal.sw_rate),  pillCls:'pill-sw'  },
  ].filter(x => x.t.goalCnt > 0);

  if (!typeDefs.length) { $('calcBlock').innerHTML = ''; return; }

  const hasManual = Object.values(ST.inNegManual).some(v => v !== null);
  const inNegHint = hasManual
    ? `<span style="font-size:10px;color:var(--wa);margin-left:6px">手打ちあり（ヨミ自動:${inNegCalc}件）</span>`
    : `<span style="font-size:10px;color:var(--mu);margin-left:6px">ヨミ自動計算</span>`;

  const typeBlocks = typeDefs.map(({ label, t, ratePct, pillCls }) => {
    const shortageOk = t.diff <= 0;
    return `
      <div style="background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px;border:2px solid var(--bdr2)">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <span class="pill ${pillCls}">${label}</span>
          <span style="font-size:11px;font-weight:800;color:var(--mu)">目標 ${t.goalCnt}件</span>
          <span style="font-size:11px;color:var(--mu);margin-left:auto">進行中商談: <strong style="color:var(--tx)">${t.inNeg}</strong>件</span>
        </div>
        <div class="cb-row">
          <span class="cb-label">着地ヨミ（期待値）</span>
          <span class="cb-val">${f1(t.landing)} 件</span>
        </div>
        <hr class="bk-hdiv">
        <div class="cb-row">
          <strong class="cb-label">不足分</strong>
          <strong class="${shortageOk ? 'cb-shortage-ok' : 'cb-shortage-ng'}">${shortageOk ? '0件（達成見込み ✅）' : f1(t.diff) + ' 件'}</strong>
        </div>
        ${!shortageOk && ratePct > 0 ? `
        <div class="cb-row" style="margin-top:4px">
          <span style="font-size:11px;color:var(--mu);font-family:var(--fm)">不足${f1(t.diff)}件 ÷ 受注率${ratePct}%</span>
          <span class="cb-meet-needed">= ${t.newOpps}件 必要（未商談）</span>
        </div>` : ''}
      </div>`;
  }).join('');

  $('calcBlock').innerHTML = `
    <div class="calc-blk">
      <div class="calc-blk-hd">進行中から逆算（タイプ別）</div>
      <div class="calc-blk-body">
        <div class="cb-spotlight">
          <span>進行中から何件商談行くか${inNegHint}</span>
          <strong>${inNeg} 件</strong>
        </div>
        ${typeBlocks}
        <div class="cb-monthly">
          <div>
            <div class="cb-monthly-lbl">月間 商談数</div>
            <div class="cb-monthly-sub">進行中 ${inNeg} ＋ 未商談 ${newMeetings} 件</div>
          </div>
          <div class="cb-monthly-val">${monthlyMeetings} 件</div>
        </div>
      </div>
    </div>`;
}

// ── SHORTAGE SUMMARY CARD ──
function renderShortageCard(c) {
  const { pr, net, sw } = c;
  const types = [
    { key:'pr',  label:'PR',  t:pr,  pillCls:'pill-pr'  },
    { key:'net', label:'NET', t:net, pillCls:'pill-net' },
    { key:'sw',  label:'切替', t:sw,  pillCls:'pill-sw'  },
  ].filter(x => x.t.goalCnt > 0);
  if (!types.length) return '';

  const inNegMap = { pr: c.prInNeg, net: c.netInNeg, sw: c.swInNeg };

  const rows = types.map(({ key, label, t, pillCls }) => {
    const shortfall  = Math.max(0, t.goalCnt - t.landing);
    const needed     = t.newOpps;
    const achieved   = t.landing >= t.goalCnt;
    const misCnt     = nv(ST.misTarget[key]);
    const adjCnt     = nv(ST.actionAdj[key]);
    const inNegVal   = ST.inNegManual[key];
    const inNegAuto  = t.inNeg;
    const extLand    = t.landing + misCnt * t.rate;
    const extPct     = t.goalCnt > 0 ? extLand / t.goalCnt * 100 : 0;
    const isOver     = extPct > 100;
    const extDiff    = Math.max(0, t.goalCnt - extLand);
    const excessCnt  = isOver ? f1(extLand - t.goalCnt) : null;
    const pctCol     = extPct>=100?'var(--ok)':extPct>=70?'var(--wa)':'var(--ng)';
    const basePct    = isOver ? 100 : t.goalCnt > 0 ? Math.min(100, t.landing / t.goalCnt * 100) : 0;
    const misBarW    = isOver ? 0 : Math.min(100 - basePct, t.goalCnt > 0 ? misCnt * t.rate / t.goalCnt * 100 : 0);
    const pctTxt     = isOver ? `${extPct.toFixed(0)}%（+${excessCnt}件超過）` : `${extPct.toFixed(0)}%`;
    const arpu       = key === 'pr' ? c.prArpu : key === 'sw' ? c.swArpu : 0;
    const landedFromMis = misCnt * t.rate;
    const misRev     = arpu > 0 && landedFromMis > 0 ? landedFromMis * arpu : 0;
    const typeInNeg  = inNegMap[key];
    const typeTotal  = typeInNeg + misCnt + adjCnt;

    return `
      <div style="background:#FAFAFA;border:2px solid var(--bdr2);border-radius:14px;padding:14px">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:10px">
          <span class="pill ${pillCls}">${label}</span>
          ${achieved ? `<span style="font-size:11px;font-weight:900;color:var(--ok)">✅ 目標達成済み</span>` : ''}
        </div>
        <!-- 不足算出 formula -->
        <div style="display:flex;align-items:baseline;gap:5px;flex-wrap:wrap;font-size:12px;font-weight:700;color:#333;line-height:2;margin-bottom:12px">
          <span>着地 <span style="font-family:var(--fm);font-size:15px;color:#1565C0">${f1(t.landing)}</span>件</span>
          <span style="color:var(--mu)">／ 目標</span>
          <span><span style="font-family:var(--fm);font-size:15px">${t.goalCnt}</span>件</span>
          ${!achieved ? `
            <span style="color:var(--mu)">→ 不足</span>
            <span style="color:var(--ng)"><span style="font-family:var(--fm);font-size:15px">${f1(shortfall)}</span>件</span>
            <span style="color:var(--mu)">÷ 受注率${(t.rate*100).toFixed(0)}%</span>
            <span style="color:var(--mu)">＝</span>
            <span style="background:var(--ng);color:#fff;border-radius:6px;padding:2px 8px"><span style="font-family:var(--fm);font-size:15px">${needed}</span>件の商談が必要</span>
          ` : ''}
        </div>
        <!-- 手打ち入力 -->
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px">
          <div class="f">
            <label>進行中 商談数</label>
            <input type="number" placeholder="${inNegAuto}（自動）" value="${inNegVal !== null ? inNegVal : ''}"
              onchange="setInNegType('${key}',this.value)"
              onkeydown="if(event.key==='Enter')setInNegType('${key}',this.value)" min="0">
          </div>
          <div class="f">
            <label>組む商談数（未商談）</label>
            <input type="number" placeholder="${needed}" value="${ST.misTarget[key]}"
              onchange="setMisTarget('${key}',this.value)"
              onkeydown="if(event.key==='Enter')setMisTarget('${key}',this.value)" min="0">
          </div>
          <div class="f">
            <label>行動数 補正</label>
            <input type="number" placeholder="0" value="${ST.actionAdj[key]}"
              onchange="setActionAdj('${key}',this.value)"
              onkeydown="if(event.key==='Enter')setActionAdj('${key}',this.value)">
          </div>
        </div>
        <div style="background:#F5F5F5;border:1.5px solid var(--bdr2);border-radius:8px;padding:6px 12px;margin-bottom:8px;font-size:11px;font-weight:800;color:var(--mu);display:flex;justify-content:space-between">
          <span>${label} 月間行動数</span>
          <span style="color:var(--tx);font-family:var(--fm)">${typeInNeg}件（進行中）＋ ${misCnt}件（未商談）${adjCnt>0?` ＋ ${adjCnt}件（補正）`:''} ＝ ${typeTotal}件</span>
        </div>
        <!-- 売上見込み（PR/切替のみ） -->
        ${misRev > 0 ? `
        <div style="background:#F0F4FF;border:1.5px solid #BFCFFF;border-radius:10px;padding:8px 12px;margin-bottom:8px;display:flex;flex-direction:column;gap:3px">
          <span style="font-size:10px;font-weight:900;color:var(--mu)">売上見込み（未商談 ${misCnt}件 × 受注率${(t.rate*100).toFixed(0)}% ＝ ${f1(landedFromMis)}件 × ARPU ${yen(arpu)}）</span>
          <span style="font-family:var(--fm);font-size:15px;font-weight:700;color:#1a1a1a;text-align:right">${yen(misRev)}</span>
        </div>` : (arpu > 0 && misCnt === 0 ? `<div style="background:#F5F5F5;border:1.5px solid var(--bdr2);border-radius:10px;padding:7px 12px;margin-bottom:8px;font-size:10px;color:var(--mu);font-weight:800">組む商談数を入力すると売上見込みを表示（ARPU: ${yen(arpu)}）</div>` : '')}
        <!-- 着地見込み -->
        <div style="background:${isOver?'#F0FDF4':'var(--misll)'};border:2px solid ${isOver?'#86EFAC':'var(--misd)'};border-radius:10px;padding:10px 12px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
            <span style="font-size:10px;font-weight:900;color:var(--mu)">着地見込み（済+進行中+未商談）</span>
            <span style="font-family:var(--fm);font-size:15px;font-weight:700;color:${pctCol}">${f1(extLand)}件</span>
          </div>
          <div style="display:flex;justify-content:space-between;margin-bottom:5px">
            <span style="font-size:10px;color:var(--mu);font-weight:700">目標 ${t.goalCnt}件 に対して</span>
            <span style="font-family:var(--fm);font-size:15px;font-weight:700;color:${pctCol}">${pctTxt}</span>
          </div>
          <div style="height:7px;background:#fff;border-radius:7px;overflow:hidden;position:relative">
            ${isOver
              ? `<div style="position:absolute;left:0;top:0;height:100%;width:100%;background:var(--ok)"></div>`
              : `<div style="position:absolute;left:0;top:0;height:100%;width:${basePct}%;background:#90CAF9"></div>
                 ${misBarW>0?`<div style="position:absolute;left:${basePct}%;top:0;height:100%;width:${misBarW}%;background:var(--mis)"></div>`:''}`
            }
          </div>
          ${isOver
            ? `<div style="margin-top:7px;font-size:11px;color:var(--ok);font-weight:900">✅ 目標達成見込み（+${excessCnt}件 超過）</div>`
            : extDiff > 0
              ? `<div style="margin-top:7px;font-size:11px;color:var(--ng);font-weight:900">まだ ${f1(extDiff)}件 不足</div>`
              : `<div style="margin-top:7px;font-size:11px;color:var(--ok);font-weight:900">✅ 目標達成見込み</div>`
          }
        </div>
      </div>`;
  }).join('');

  const totalMis   = types.reduce((s, { key }) => s + nv(ST.misTarget[key]), 0);
  const totalAdj   = types.reduce((s, { key }) => s + nv(ST.actionAdj[key]), 0);
  const grandTotal = c.inNeg + totalMis + totalAdj;

  const inNegRows = types.map(({ key, label, pillCls }) =>
    `<div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;color:#7a4500">
       <span style="display:flex;align-items:center;gap:4px"><span class="pill ${pillCls}" style="font-size:9px;padding:2px 7px">${label}</span>進行中</span>
       <span style="font-family:var(--fm)">${inNegMap[key]}件</span>
     </div>`).join('');

  const misRows = types.map(({ key, label, pillCls }) => {
    const mc = nv(ST.misTarget[key]);
    return mc > 0 ? `<div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;color:#7a4500">
       <span style="display:flex;align-items:center;gap:4px"><span class="pill ${pillCls}" style="font-size:9px;padding:2px 7px">${label}</span>未商談</span>
       <span style="font-family:var(--fm)">${mc}件</span>
     </div>` : '';
  }).join('');

  return `
    <div class="card" style="margin-bottom:14px">
      <div class="card-ttl">不足商談 自動算出 ／ 行動計画 入力</div>
      <div style="display:flex;flex-direction:column;gap:10px">${rows}</div>
      <div style="margin-top:12px;padding:14px 16px;background:#FFF3E0;border:2px solid #FFCC80;border-radius:14px">
        <div style="font-size:11px;font-weight:900;color:#E65100;margin-bottom:10px;letter-spacing:.06em;text-transform:uppercase">月間 行動数 合計</div>
        <div style="display:flex;flex-direction:column;gap:6px">
          ${inNegRows}
          ${misRows}
          ${totalAdj > 0 ? `<div style="display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:#7a4500">
            <span>行動数 補正</span>
            <span style="font-family:var(--fm)">+${totalAdj}件</span>
          </div>` : ''}
          <div style="border-top:2px dashed #FFCC80;margin:2px 0;padding-top:8px;display:flex;justify-content:space-between;align-items:baseline">
            <span style="font-size:13px;font-weight:900;color:#E65100">1か月間の行動数</span>
            <span style="font-family:var(--fm);font-size:26px;font-weight:700;color:#E65100">${grandTotal}<span style="font-size:13px;margin-left:2px">件</span></span>
          </div>
        </div>
      </div>
    </div>`;
}

// ── RENDER: RESULT TAB ──
function renderResultTab() {
  const c = calcAll();
  const hasGoal = ST.goal.pr_cnt || ST.goal.net_cnt || ST.goal.sw_cnt;

  if (!hasGoal) {
    $('tab-result').innerHTML = `<div class="empty">目標が未入力です。「目標設定」タブから入力してください。</div>`;
    return;
  }

  const { weeklyActions, totalActions, monthlyMeetings, newActions, adjTotal, wk, pr, net, sw } = c;

  // Alert
  const alCls = weeklyActions === 0 ? 'al-ok' : weeklyActions <= 5 ? 'al-wa' : 'al-ng';
  const alMsg = weeklyActions === 0
    ? '✅ 現在のヨミ着地で全目標達成の見込みです。'
    : `${weeklyActions <= 5 ? '⚠️' : '🔴'} 週合計 ${weeklyActions} 件の行動が必要です。`;

  // Hero
  const misTotalStr = c.newMeetings > 0 ? ` ＋ 未商談${c.newMeetings}件` : '';
  const adjStr = adjTotal > 0 ? ` ＋ 補正${adjTotal}件` : '';
  const heroHtml = `
    <div class="hero-card">
      <div class="hero-label">週あたり合計行動数</div>
      <div class="hero-val">${weeklyActions}<span class="hero-unit">件 / 週</span></div>
      <div class="hero-sub">月間 ${totalActions}件 ／ 進行中${c.inNeg}件${misTotalStr}${adjStr}</div>
    </div>`;

  // RC3: 月間行動 / 月間商談 / 残り週
  const rc3Html = `
    <div class="rc3">
      <div class="rc">
        <div class="rl">月間 総行動数</div>
        <div class="rv">${totalActions}<span class="ru">件</span></div>
        <div class="rs">未商談${newActions}件${adjTotal>0?' ＋ 補正'+adjTotal+'件':''}</div>
      </div>
      <div class="rc">
        <div class="rl">月間 商談数</div>
        <div class="rv">${monthlyMeetings}<span class="ru">件</span></div>
        <div class="rs">進行中${c.inNeg} ＋ 未商談${c.newMeetings}件</div>
      </div>
      <div class="rc">
        <div class="rl">残り週数</div>
        <div class="rv">${wk}<span class="ru">週</span></div>
        <div class="rs">週あたり ${weeklyActions} 件</div>
      </div>
    </div>`;

  // Progress per type（未商談計画含む・積み上げバー）
  const pbGrad = { pr:'linear-gradient(90deg,var(--pr),#60A5FA)', net:'linear-gradient(90deg,var(--net),#22D3EE)', sw:'linear-gradient(90deg,var(--sw),#A78BFA)' };
  const typePb = [
    { label:'PR',  key:'pr',  t:pr,  extPct:c.prExtPct,  extLanding:c.prExtLanding  },
    { label:'NET', key:'net', t:net, extPct:c.netExtPct, extLanding:c.netExtLanding },
    { label:'切替', key:'sw', t:sw,  extPct:c.swExtPct,  extLanding:c.swExtLanding  },
  ].filter(x => x.t.goalCnt > 0).map(({ label, key, t, extPct, extLanding }) => {
    const misAdded  = nv(ST.misTarget[key]) * t.rate;
    const isOver    = extPct > 100;
    const excessCnt = isOver ? f1(extLanding - t.goalCnt) : null;
    const basePct   = isOver ? 100 : t.goalCnt > 0 ? Math.min(100, t.landing / t.goalCnt * 100) : 0;
    const misWidth  = isOver ? 0 : Math.min(100 - basePct, t.goalCnt > 0 ? misAdded / t.goalCnt * 100 : 0);
    const pctCol    = extPct>=100?'var(--ok)':extPct>=70?'var(--wa)':'var(--ng)';
    const pctTxt    = isOver ? `${extPct.toFixed(0)}%（+${excessCnt}件超過）` : `${extPct.toFixed(0)}%`;
    return `
      <div class="pb-wrap">
        <div class="pb-label">
          <span>${label}　${f1(extLanding)}件 / 目標${t.goalCnt}件${misAdded>0?` （現況${f1(t.landing)}＋未商談${f1(misAdded)}）`:''}</span>
          <span style="color:${pctCol}">${pctTxt}</span>
        </div>
        <div style="height:8px;border-radius:8px;background:#F0F0F0;overflow:hidden;position:relative">
          ${isOver
            ? `<div style="position:absolute;left:0;top:0;height:100%;width:100%;background:var(--ok)"></div>`
            : `<div style="position:absolute;left:0;top:0;height:100%;width:${basePct}%;background:${pbGrad[key]}"></div>
               ${misWidth>0?`<div style="position:absolute;left:${basePct}%;top:0;height:100%;width:${misWidth}%;background:var(--mis)"></div>`:''}`
          }
        </div>
      </div>`;
  }).join('');

  const progHtml = typePb ? `<div class="card">${typePb}</div>` : '';

  // Yomi Tower
  const towerHtml = renderTower(c);

  // 週次シミュレーション（2週 vs 3週）
  const weekCmpHtml = totalActions > 0 ? `
    <div class="card" style="margin-bottom:14px">
      <div class="card-ttl">必要行動数 週次シミュレーション</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
        <div style="background:#F9F9F9;border-radius:14px;padding:18px;text-align:center;border:2px solid var(--bdr)">
          <div style="font-size:11px;font-weight:900;color:var(--mu);margin-bottom:8px;letter-spacing:.06em">2週間で達成</div>
          <div style="font-family:var(--fm);font-size:40px;font-weight:700;color:#1a1a1a;line-height:1">${cl(totalActions/2)}</div>
          <div style="font-size:12px;color:var(--mu);font-weight:700;margin-top:6px">件 / 週</div>
        </div>
        <div style="background:var(--y);border-radius:14px;padding:18px;text-align:center;border:2px solid var(--yd);box-shadow:var(--sh2)">
          <div style="font-size:11px;font-weight:900;color:rgba(26,26,26,.55);margin-bottom:8px;letter-spacing:.06em">3週間で達成</div>
          <div style="font-family:var(--fm);font-size:40px;font-weight:700;color:#1a1a1a;line-height:1">${cl(totalActions/3)}</div>
          <div style="font-size:12px;color:rgba(26,26,26,.55);font-weight:700;margin-top:6px">件 / 週</div>
        </div>
      </div>
      <div style="text-align:center;font-size:11px;color:var(--mu);font-weight:700">月間総行動数: ${totalActions}件</div>
    </div>` : '';

  // Week plan
  const wkHtml = renderWeekPlan(c);

  $('tab-result').innerHTML = `
    <div class="al ${alCls}">${alMsg}</div>
    ${renderShortageCard(c)}${heroHtml}${weekCmpHtml}${rc3Html}${progHtml}${towerHtml}${wkHtml}`;
}

// ── TOWER ──
function renderTower(c) {
  const { pr, net, sw } = c;
  const prArpu = c.prArpu, swArpu = c.swArpu;
  const yp = ST.yomi.pr, yn = ST.yomi.net, ys = ST.yomi.sw;

  const prZumi = nv(yp.zumi), netZumi = nv(yn.zumi), swZumi = nv(ys.zumi);
  const prProg = nv(yp.a)+nv(yp.b)*.7+nv(yp.c)*.3+nv(yp.d)*.1;
  const netProg= nv(yn.a)+nv(yn.b)*.7+nv(yn.c)*.3+nv(yn.d)*.1;
  const swProg = nv(ys.a)+nv(ys.b)*.7+nv(ys.c)*.3+nv(ys.d)*.1;

  // 未商談計画 × 受注率 = 期待着地追加
  const prMisL  = nv(ST.misTarget.pr)  * pr.rate;
  const netMisL = nv(ST.misTarget.net) * net.rate;
  const swMisL  = nv(ST.misTarget.sw)  * sw.rate;

  const goalRev  = nv(ST.goal.pr_rev) + nv(ST.goal.sw_rev);
  const landRev  = (prZumi+prProg)*prArpu + (swZumi+swProg)*swArpu;
  const revZumi  = prZumi*prArpu + swZumi*swArpu;
  const revProg  = prProg*prArpu + swProg*swArpu;
  const revMisL  = prMisL*prArpu + swMisL*swArpu;

  const towers = [
    { label:'PR件数',  pillCls:'pill-pr',
      goalCnt:pr.goalCnt,  zumi:prZumi,  prog:prProg,  misL:prMisL,  isRev:false },
    { label:'NET件数', pillCls:'pill-net',
      goalCnt:net.goalCnt, zumi:netZumi, prog:netProg, misL:netMisL, isRev:false },
    { label:'売上合計', pillCls:'pill-rev',
      goalCnt:goalRev, zumi:revZumi, prog:revProg, misL:revMisL, isRev:true },
  ].filter(t => t.goalCnt > 0);

  if (!towers.length) return '';

  const TH = 200;
  const fv = (t, v) => t.isRev ? Math.round(v).toLocaleString('ja-JP')+'円' : f1(v)+'件';

  const cols = towers.map(t => {
    const landing  = t.zumi + t.prog;
    const extLand  = landing + t.misL;
    const extDiff  = Math.max(0, t.goalCnt - extLand);
    const extPct   = t.goalCnt > 0 ? Math.min(100, extLand / t.goalCnt * 100) : 0;
    const denom    = Math.max(t.goalCnt, extLand + 0.001);
    const zh = Math.min((t.zumi  / denom) * TH, TH);
    const ph = Math.min((Math.max(0, t.prog) / denom) * TH, TH - zh);
    const mh = Math.min((Math.max(0, t.misL) / denom) * TH, TH - zh - ph);
    const dh = Math.max(0, TH - zh - ph - mh);
    const pctCol = extPct>=100?'var(--ok)':extPct>=70?'var(--wa)':'var(--ng)';
    const basePct = t.goalCnt > 0 ? Math.min(100, landing / t.goalCnt * 100) : 0;
    const misBarW = Math.min(100 - basePct, t.goalCnt > 0 ? t.misL / t.goalCnt * 100 : 0);

    return `
      <div style="display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span class="pill ${t.pillCls}">${t.label}</span>
          <span style="font-family:var(--fm);font-size:10px;font-weight:700;color:var(--mu)">目標 ${fv(t,t.goalCnt)}</span>
        </div>
        <div style="height:${TH}px;border-radius:12px;border:2px solid #BBDEFB;overflow:hidden;display:flex;flex-direction:column">
          <div style="flex:0 0 ${dh}px;background:#EEF6FF;display:flex;align-items:center;justify-content:center;${dh>2?'border-bottom:1.5px dashed #90CAF9':''}">
            ${dh >= 22 && extDiff > 0 ? `<span style="font-size:10px;font-weight:800;color:#5BA3D9;font-family:var(--fm)">差分 ${fv(t,extDiff)}</span>` : ''}
          </div>
          ${mh > 0 ? `<div style="flex:0 0 ${mh}px;background:var(--mis);display:flex;align-items:center;justify-content:center;border-bottom:1.5px dashed var(--misd)">
            ${mh >= 16 ? `<span style="font-size:9px;font-weight:900;color:#fff;font-family:var(--fm)">未商談 ${fv(t,t.misL)}</span>` : ''}
          </div>` : ''}
          ${ph > 0 ? `<div style="flex:0 0 ${ph}px;background:#90CAF9;display:flex;align-items:center;justify-content:center">
            ${ph >= 18 ? `<span style="font-size:10px;font-weight:800;color:#fff;font-family:var(--fm)">進行中 ${fv(t,t.prog)}</span>` : ''}
          </div>` : ''}
          ${zh > 0 ? `<div style="flex:0 0 ${zh}px;background:#1565C0;display:flex;align-items:center;justify-content:center">
            ${zh >= 18 ? `<span style="font-size:10px;font-weight:800;color:#fff;font-family:var(--fm)">済 ${fv(t,t.zumi)}</span>` : ''}
          </div>` : ''}
        </div>
        <div style="background:var(--misll);border:2px solid var(--misd);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:5px">
          <div style="display:flex;justify-content:space-between;align-items:baseline">
            <span style="font-size:10px;font-weight:900;color:var(--mu)">着地見込み（未商談含）</span>
            <span style="font-family:var(--fm);font-size:14px;font-weight:700;color:${pctCol}">${fv(t,extLand)}</span>
          </div>
          <div>
            <div style="display:flex;justify-content:space-between;margin-bottom:3px">
              <span style="font-size:9px;font-weight:800;color:var(--mu)">達成率</span>
              <span style="font-family:var(--fm);font-size:12px;font-weight:700;color:${pctCol}">${extPct.toFixed(0)}%</span>
            </div>
            <div style="height:5px;background:#fff;border-radius:5px;overflow:hidden;position:relative">
              <div style="position:absolute;left:0;top:0;height:100%;border-radius:5px;width:${basePct}%;background:#1565C0"></div>
              ${misBarW>0?`<div style="position:absolute;left:${basePct}%;top:0;height:100%;width:${misBarW}%;background:var(--mis)"></div>`:''}
            </div>
          </div>
          ${extDiff > 0 ? `<div style="display:flex;justify-content:space-between;padding-top:5px;border-top:1px dashed var(--misd)"><span style="font-size:10px;font-weight:900;color:var(--ng)">差分（不足）</span><span style="font-family:var(--fm);font-size:13px;font-weight:700;color:var(--ng)">${fv(t,extDiff)}</span></div>` : ''}
          ${extDiff <= 0 ? `<div style="background:var(--ok);border-radius:8px;padding:7px 10px;text-align:center;font-size:11px;font-weight:900;color:#fff">✅ 目標達成見込み</div>` : ''}
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${[['1.受注済み','#1565C0'],['2.進行中商談','#90CAF9'],['3.未商談からの獲得','var(--mis)'],['差分','#EEF6FF','1.5px solid #90CAF9']].map(([l,c,b])=>`<div style="display:flex;align-items:center;gap:3px"><div style="width:8px;height:8px;border-radius:2px;background:${c};border:${b||'none'}"></div><span style="font-size:9px;font-weight:800;color:var(--mu)">${l}</span></div>`).join('')}
        </div>
      </div>`;
  }).join('');

  return `
    <div class="card">
      <div class="card-ttl">ヨミタワー</div>
      <div style="display:grid;grid-template-columns:repeat(${towers.length},1fr);gap:14px">${cols}</div>
    </div>`;
}

// ── MIS INPUT CARD ──
function renderMisInput(c) {
  const types = [
    { key:'pr',  label:'PR',  t:c.pr,  pillCls:'pill-pr'  },
    { key:'net', label:'NET', t:c.net, pillCls:'pill-net' },
    { key:'sw',  label:'切替', t:c.sw,  pillCls:'pill-sw'  },
  ].filter(x => x.t.goalCnt > 0);
  if (!types.length) return '';

  const items = types.map(({ key, label, t, pillCls }) => {
    const suggested = t.newOpps;
    const entered   = ST.misTarget[key];
    const misCnt    = nv(entered);
    const extLand   = t.landing + misCnt * t.rate;
    const extPct    = t.goalCnt > 0 ? extLand / t.goalCnt * 100 : 0;
    const isOver    = extPct > 100;
    const extDiff   = Math.max(0, t.goalCnt - extLand);
    const excessCnt = isOver ? f1(extLand - t.goalCnt) : null;
    const pctCol    = extPct>=100?'var(--ok)':extPct>=70?'var(--wa)':'var(--ng)';
    const basePct   = isOver ? 100 : t.goalCnt > 0 ? Math.min(100, t.landing / t.goalCnt * 100) : 0;
    const misBarW   = isOver ? 0 : Math.min(100 - basePct, t.goalCnt > 0 ? misCnt * t.rate / t.goalCnt * 100 : 0);
    const pctTxt    = isOver ? `${extPct.toFixed(0)}%（+${excessCnt}件超過）` : `${extPct.toFixed(0)}%`;

    const arpu      = key === 'pr' ? c.prArpu : key === 'sw' ? c.swArpu : 0;
    const misRev    = arpu > 0 && misCnt > 0 ? misCnt * arpu : 0;

    return `
      <div style="background:#FAFAFA;border:2px solid var(--bdr2);border-radius:14px;padding:14px">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:10px">
          <span class="pill ${pillCls}">${label}</span>
          <span style="font-size:10px;color:var(--mu);font-weight:800">逆算提案: ${suggested}件</span>
        </div>
        <div class="f" style="margin-bottom:10px">
          <label>未商談 組む件数</label>
          <input type="number" placeholder="${suggested}" value="${entered}"
            onchange="setMisTarget('${key}',this.value)"
            onkeydown="if(event.key==='Enter')setMisTarget('${key}',this.value)" min="0">
        </div>
        ${misRev > 0 ? `
        <div style="background:#F0F4FF;border:1.5px solid #BFCFFF;border-radius:10px;padding:9px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:10px;font-weight:900;color:var(--mu)">売上見込み（${misCnt}件 × ARPU ${yen(arpu)}）</span>
          <span style="font-family:var(--fm);font-size:14px;font-weight:700;color:#1a1a1a">${yen(misRev)}</span>
        </div>` : (arpu > 0 ? `<div style="background:#F5F5F5;border:1.5px solid var(--bdr2);border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:10px;color:var(--mu);font-weight:800">件数を入力すると売上見込みを表示（ARPU: ${yen(arpu)}）</div>` : '')}
        <div style="background:${isOver?'#F0FDF4':extPct>=100?'#F0FDF4':'var(--yll)'};border:2px solid ${isOver?'#86EFAC':extPct>=100?'#86EFAC':'var(--yl)'};border-radius:10px;padding:10px 12px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
            <span style="font-size:10px;font-weight:900;color:var(--mu)">着地見込み（済+進行中+未商談）</span>
            <span style="font-family:var(--fm);font-size:15px;font-weight:700;color:${pctCol}">${f1(extLand)}件</span>
          </div>
          <div style="display:flex;justify-content:space-between;margin-bottom:5px">
            <span style="font-size:10px;color:var(--mu);font-weight:700">目標 ${t.goalCnt}件 に対して</span>
            <span style="font-family:var(--fm);font-size:16px;font-weight:700;color:${pctCol}">${pctTxt}</span>
          </div>
          <div style="height:8px;background:#fff;border-radius:8px;overflow:hidden;position:relative">
            ${isOver
              ? `<div style="position:absolute;left:0;top:0;height:100%;width:100%;background:var(--ok)"></div>`
              : `<div style="position:absolute;left:0;top:0;height:100%;width:${basePct}%;background:#90CAF9"></div>
                 ${misBarW>0?`<div style="position:absolute;left:${basePct}%;top:0;height:100%;width:${misBarW}%;background:var(--y)"></div>`:''}`
            }
          </div>
          ${isOver
            ? `<div style="margin-top:8px;font-size:11px;color:var(--ok);font-weight:900">✅ 目標達成見込み（+${excessCnt}件 超過）</div>`
            : extDiff > 0
              ? `<div style="margin-top:8px;font-size:11px;color:var(--ng);font-weight:900">まだ ${f1(extDiff)}件 不足</div>`
              : `<div style="margin-top:8px;font-size:11px;color:var(--ok);font-weight:900">✅ 目標達成見込み</div>`
          }
        </div>
      </div>`;
  }).join('');

  return `
    <div class="card" style="margin-bottom:14px">
      <div class="card-ttl">未商談 計画入力（達成に向けた商談組み数）</div>
      <div style="display:grid;grid-template-columns:repeat(${types.length},1fr);gap:12px">${items}</div>
    </div>`;
}

// ── WEEK PLAN ──
function renderWeekPlan(c) {
  if (c.weeklyActions === 0) return '';
  const { wk, newActions, monthlyMeetings } = c;
  const newPerWk  = cl(newActions / wk);
  const meetPerWk = cl(monthlyMeetings / wk);
  const cols = `44px 1fr 1fr 64px`;
  let rows = '', cumul = 0;
  for (let i = 0; i < wk; i++) {
    const wN = i < wk-1 ? newPerWk  : Math.max(0, newActions       - newPerWk  * (wk-1));
    const wM = i < wk-1 ? meetPerWk : Math.max(0, monthlyMeetings  - meetPerWk * (wk-1));
    cumul += wN;
    rows += `<div class="wk-row" style="grid-template-columns:${cols}">
      <span class="wk-n">W${i+1}</span>
      <span class="wk-v">${wN}件</span>
      <span class="wk-v" style="color:var(--sw);font-weight:800">${wM}件</span>
      <span class="wk-total">${cumul}件</span>
    </div>`;
  }
  return `
    <div class="wk-plan" style="margin-top:14px">
      <div class="wk-head" style="grid-template-columns:${cols}">
        <span>週</span><span>行動数</span>
        <span style="color:var(--sw)">商談数</span><span>累計</span>
      </div>
      ${rows}
    </div>`;
}

// ── USER PERSISTENCE ──
const LS_KEY = 'sac_v2';
let currentUser = null;

const EMPTY_GOAL = { pr_cnt:'', pr_rev:'', pr_rate:'', pr_arpu_est:'', net_cnt:'', net_rate:'', sw_cnt:'', sw_rev:'', sw_rate:'', sw_arpu_est:'' };
const EMPTY_YOMI = () => ({ pr:{zumi:'',a:'',b:'',c:'',d:'',mis:''}, net:{zumi:'',a:'',b:'',c:'',d:'',mis:''}, sw:{zumi:'',a:'',b:'',c:'',d:'',mis:''} });

function loadStore() { try { return JSON.parse(localStorage.getItem(LS_KEY) || '{"users":{}}'); } catch(e) { return {users:{}}; } }
function saveStore(s) { try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch(e) {} }

function getUserData() {
  return {
    goal:        JSON.parse(JSON.stringify(ST.goal)),
    yomi:        JSON.parse(JSON.stringify(ST.yomi)),
    inNegManual: ST.inNegManual,
    weeksLeft:   ST.weeksLeft,
    misTarget:   JSON.parse(JSON.stringify(ST.misTarget)),
    actionAdj:   JSON.parse(JSON.stringify(ST.actionAdj)),
  };
}

function applyUserData(data) {
  ST.goal        = Object.assign({...EMPTY_GOAL}, data.goal || {});
  ST.yomi        = data.yomi ? JSON.parse(JSON.stringify(data.yomi)) : EMPTY_YOMI();
  const savedInNeg = data.inNegManual;
  ST.inNegManual = (savedInNeg && typeof savedInNeg === 'object')
    ? Object.assign({pr:null,net:null,sw:null}, savedInNeg)
    : {pr:null,net:null,sw:null};
  ST.weeksLeft   = data.weeksLeft || 3;
  ST.misTarget   = Object.assign({pr:'',net:'',sw:''}, data.misTarget || {});
  ST.actionAdj   = Object.assign({pr:'',net:'',sw:''}, data.actionAdj || {});
}

function saveCurrentUser() {
  if (!currentUser) return;
  const s = loadStore();
  if (!s.users) s.users = {};
  s.users[currentUser] = getUserData();
  s.currentUser = currentUser;
  saveStore(s);
}

function loginUser(name) {
  const n = (name || '').trim();
  if (!n) return;
  const s = loadStore();
  if (s.users && s.users[n]) {
    applyUserData(s.users[n]);
  } else {
    applyUserData({});
    const s2 = loadStore();
    if (!s2.users) s2.users = {};
    s2.users[n] = getUserData();
    s2.currentUser = n;
    saveStore(s2);
  }
  currentUser = n;
  saveCurrentUser();
  showApp();
}

function doLogin() {
  const name = $('loginNameInput').value.trim();
  if (!name) { $('loginNameInput').focus(); return; }
  loginUser(name);
  restoreInputs();
  update();
}

function switchUser(name) {
  saveCurrentUser();
  loginUser(name);
  restoreInputs();
  update();
  closeUserDrop();
}

function logout() {
  saveCurrentUser();
  currentUser = null;
  const s = loadStore();
  delete s.currentUser;
  saveStore(s);
  closeUserDrop();
  showLoginScreen();
}

function showApp() {
  $('loginOverlay').style.display = 'none';
  $('userBadgeWrap').style.display = '';
  $('userBadgeNm').textContent = currentUser;
  $('userBadgeAv').textContent = currentUser.charAt(0).toUpperCase();
  renderUserDrop();
}

function showLoginScreen() {
  $('loginOverlay').style.display = 'flex';
  $('userBadgeWrap').style.display = 'none';
  $('loginNameInput').value = '';
  renderUserChips();
}

function renderUserChips() {
  const s = loadStore();
  const names = Object.keys(s.users || {});
  const sec = $('existingUsersSection');
  if (!names.length) { sec.style.display = 'none'; return; }
  sec.style.display = '';
  $('userChips').innerHTML = names.map(n =>
    `<div class="user-chip" onclick="document.getElementById('loginNameInput').value='${n.replace(/'/g,"\\'")}';doLogin()">${n}</div>`
  ).join('');
}

function renderUserDrop() {
  const s = loadStore();
  const names = Object.keys(s.users || {});
  $('userDropItems').innerHTML = names.map(n => `
    <div class="ud-item${n===currentUser?' cur':''}" onclick="switchUser('${n.replace(/'/g,"\\'")}')">
      <div class="ud-av">${n.charAt(0).toUpperCase()}</div>
      <span>${n}</span>${n===currentUser?' <span style="margin-left:auto;font-size:10px;color:var(--ok)">✓</span>':''}
    </div>`).join('');
}

function toggleUserMenu() { $('userDrop').classList.toggle('open'); }
function closeUserDrop()  { $('userDrop').classList.remove('open'); }

document.addEventListener('click', e => {
  if (!e.target.closest('.ubw')) closeUserDrop();
});

function restoreInputs() {
  const g = ST.goal;
  const sv = (id, v) => { const el = $(id); if (el) el.value = (v !== '' && v != null) ? v : ''; };
  sv('inp-pr-cnt',  g.pr_cnt);
  sv('inp-pr-rev',  g.pr_rev);
  sv('inp-pr-rate', g.pr_rate);
  sv('inp-pr-arpu', g.pr_arpu_est);
  sv('inp-net-cnt', g.net_cnt);
  sv('inp-net-rate',g.net_rate);
  sv('inp-sw-cnt',  g.sw_cnt);
  sv('inp-sw-rev',  g.sw_rev);
  sv('inp-sw-rate', g.sw_rate);
  sv('inp-sw-arpu', g.sw_arpu_est);
  const sl = document.querySelector('.sl-row input[type=range]');
  if (sl) {
    sl.value = ST.weeksLeft;
    sl.style.setProperty('--fill', ((ST.weeksLeft-1)/3*100).toFixed(1)+'%');
    $('slVal').textContent = ST.weeksLeft;
  }
  // inNeg inputs are in the dynamically rendered shortage card; no static restore needed
}

// ── TAB SWITCH ──
function switchTab(t) {
  ST.tab = t;
  ['goal','yomi','result'].forEach(id => {
    $('tab-'+id).style.display = id === t ? '' : 'none';
  });
  document.querySelectorAll('.tab').forEach((btn, i) => {
    btn.classList.toggle('on', ['goal','yomi','result'][i] === t);
  });
  if (t === 'yomi')   { renderYomiCard(); renderCalcBlock(); }
  if (t === 'result') renderResultTab();
}

// ── MASTER UPDATE ──
function update() {
  updArpu();
  if (ST.tab === 'yomi')   { renderYomiCard(); renderCalcBlock(); }
  if (ST.tab === 'result') renderResultTab();
  saveCurrentUser();
}

// ── INIT ──
(function init() {
  const now = new Date();
  $('monthTag').textContent = `${now.getFullYear()}年${now.getMonth()+1}月`;
  const s = loadStore();
  if (s.currentUser && s.users && s.users[s.currentUser]) {
    loginUser(s.currentUser);
    restoreInputs();
  } else {
    showLoginScreen();
  }
  renderYomiCard();
  renderCalcBlock();
})();
</script>
</body>
